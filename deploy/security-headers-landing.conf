# Security response headers for the qwid.org landing site.
#
# The landing site is static files served by Apache 2.4 on a different host
# (35.157.129.204) than the explorer, so unlike the explorer — which sets these
# headers in Go, in cmd/explorer/main.go — it has no application code to put
# them in. They belong in the vhost.
#
# Install:
#   sudo a2enmod headers
#   sudo cp security-headers-landing.conf /etc/apache2/conf-available/
#   sudo a2enconf security-headers-landing
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Or paste the block below directly inside <VirtualHost *:443>.
#
# Verify afterwards with:
#   curl -sI https://qwid.org/ | grep -iE 'strict-transport|x-frame|x-content|referrer|permissions|cross-origin'
#
# "always" matters: without it Apache applies the header only to 2xx/3xx
# responses, leaving 404 and 500 pages unprotected.

<IfModule mod_headers.c>

    # HSTS. Deliberately short for now, and deliberately WITHOUT
    # includeSubDomains.
    #
    # On the apex domain, includeSubDomains would force HTTPS on every present
    # and future *.qwid.org — including any subdomain that is still plain HTTP
    # and any that does not exist yet. Confirm every subdomain serves HTTPS
    # before adding it.
    #
    # The short max-age is the same caution taken for the explorer: HSTS turns
    # an expired certificate from a warning the visitor can dismiss into a hard
    # block with no way past. explorer.qwid.org's certificate did expire on
    # 2026-08-12 because renewal had been failing unnoticed. Raise to 31536000
    # once renewal here has been seen to succeed unattended at least twice.
    # Do not add "preload" — preload entries are slow and painful to reverse.
    Header always set Strict-Transport-Security "max-age=86400"

    # Never let the browser second-guess a declared Content-Type.
    Header always set X-Content-Type-Options "nosniff"

    # Clickjacking. Nothing on the site is meant to be framed.
    Header always set X-Frame-Options "DENY"

    # Send the origin, never the full path, to other sites. Matches the
    # privacy notice's claim that visits are not disclosed to third parties.
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # The site uses none of these capabilities; deny them so injected script
    # cannot request them either.
    Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=(), xr-spatial-tracking=()"

    # Detach this browsing context from any window that opened it.
    Header always set Cross-Origin-Opener-Policy "same-origin"

    # Assets here are for this origin only. Note the asymmetry with the
    # explorer: explorer.qwid.org/api/* answers "cross-origin" precisely so
    # that this site can fetch live network figures from it. Nothing on
    # qwid.org is consumed the other way round, so same-origin is correct here.
    Header always set Cross-Origin-Resource-Policy "same-origin"

    # CSP. Read the two compromises below before changing anything.
    #
    # script-src is strict — no 'unsafe-inline'. index.html, audit.html and
    # privacy.html carry no inline <script> and no inline event handlers; their
    # code lives in app.js, audit.js, privacy.js and marked.min.js.
    #
    # The one exception is the Schema.org block in index.html. JSON-LD cannot be
    # loaded from a file (browsers ignore src on application/ld+json), CSP
    # governs <script> elements regardless of type, and dropping it would remove
    # the site's structured data from search results. So it is allowed by hash.
    #
    #   WARNING: editing that JSON-LD block by even one character invalidates
    #   the hash and the block is then silently blocked — the page keeps
    #   working, only the structured data disappears. Recompute with:
    #
    #     python3 -c "import hashlib,base64;s=open('www/index.html',encoding='utf-8').read();\
    #     o='<script type=\"application/ld+json\">';i=s.index(o)+len(o);\
    #     print('sha256-'+base64.b64encode(hashlib.sha256(s[i:s.index('</script>',i)].encode()).digest()).decode())"
    #
    # style-src, by contrast, keeps 'unsafe-inline', and that is a deliberate
    # concession rather than an oversight. index.html contains 53 inline style=""
    # attributes; converting them all to classes is a purely visual refactor
    # with real regression risk and no way to verify it short of rendering every
    # breakpoint. The explorer had six, so it got the strict policy. CSS
    # injection is also a far smaller prize than script injection, which is what
    # script-src actually shuts down here.
    #
    # connect-src names explorer.qwid.org because the home page fetches live
    # network figures and posts the contact form there.
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-GKKDWarQBO1fK8HODJRuL/bh4ejvDXktO6Z91R1LB7Y='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://explorer.qwid.org; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

</IfModule>

# Deploying this file alone is not enough.
#
# The CSP above assumes the restructured markup: www/app.js, www/audit.js and
# www/privacy.js must be copied to the server together with the HTML that now
# references them. Publishing the new .conf against the old inline-script HTML
# leaves a page whose scripts are all refused; publishing the new HTML without
# the .conf simply works, un-protected. Ship the HTML first if you want to
# stage it.
