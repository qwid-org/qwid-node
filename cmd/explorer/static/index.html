<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWID Explorer — Blockchain Beyond Quantum</title>
<!-- Fonts are self-hosted, never fetched from a font CDN: the privacy policy at
     qwid.org/privacy.html promises that no third party receives a request when a
     visitor opens a page, so a CDN font link would disclose the visitor's IP
     address to that provider and contradict it. Same files as www/fonts/. -->
<link rel="stylesheet" href="fonts/fonts.css">
<!-- Styles and behaviour live in app.css and app.js rather than inline. The
     Content-Security-Policy sent by cmd/explorer/main.go allows neither inline
     <style> nor inline <script> nor onclick="" attributes, so keeping any of
     them here would simply stop the page from working. -->
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>

<div class="header">
  <a class="header-brand" href="#/">
    <span class="header-logo">QW<span>ID</span></span>
    <span class="header-sub">Explorer</span>
  </a>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Block height, tx hash, or address…">
    <button type="button" id="searchBtn">Search</button>
  </div>
  <a class="header-back" href="https://qwid.org" target="_blank" rel="noopener">← qwid.org</a>
</div>

<div class="nav">
  <a href="#/" id="nav-dashboard">Dashboard</a>
  <a href="#/blocks" id="nav-blocks">Blocks</a>
  <a href="#/validators" id="nav-validators">Validators</a>
</div>

<div class="container" id="content">
  <div class="loading">Loading…</div>
</div>

</body>
</html>
